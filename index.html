<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Иван Иванов. Сайты и веб-приложения</title>
  <meta name="description" content="Портфолио fullstack-разработчика Ивана Иванова: лендинги, интернет-магазин, онлайн-запись, дашборд и PWA с живыми демо." />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

  <!-- Тема применяется до отрисовки, чтобы не было вспышки светлого фона -->
  <script>
    try {
      var t = localStorage.getItem("portfolio.theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">К содержимому</a>

  <header class="header">
    <div class="container header__inner">
      <a class="logo" href="#top" data-bind="logo"></a>

      <nav class="nav" id="nav" aria-label="Основная навигация">
        <a href="#projects">Работы</a>
        <a href="#about">Обо мне</a>
        <a href="#skills">Что умею</a>
        <a href="#experience">Опыт</a>
        <a href="#contact">Контакты</a>
      </nav>

      <div class="header__actions">
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Переключить тему">
          <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="icon-btn nav-toggle" id="nav-toggle" type="button" aria-label="Меню" aria-controls="nav" aria-expanded="false">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="hero" id="top">
      <div class="container hero__grid">
        <div class="hero__text">
          <p class="status"><span class="status__dot"></span><span data-bind="status"></span></p>
          <h1 class="hero__title">
            <span data-bind="name"></span>
            <span class="hero__role" data-bind="role"></span>
          </h1>
          <p class="hero__tagline" data-bind="tagline"></p>
          <div class="hero__cta">
            <a class="btn btn--primary" href="#projects">Смотреть работы</a>
            <a class="btn" href="#contact">Связаться</a>
          </div>
        </div>

        <div class="terminal" aria-label="Краткая информация в формате JSON">
          <div class="terminal__bar">
            <span></span><span></span><span></span>
            <p class="terminal__title">bash</p>
          </div>
          <pre class="terminal__body"><code id="terminal"></code></pre>
        </div>
      </div>
    </section>

    <section class="section" id="projects">
      <div class="container">
        <div class="section__head">
          <h2 class="section__title">Работы</h2>
          <div class="filters" id="filters" role="group" aria-label="Фильтр проектов"></div>
        </div>
        <div class="projects" id="projects-list"></div>
      </div>
    </section>

    <section class="section" id="about">
      <div class="container about">
        <div>
          <h2 class="section__title">Обо мне</h2>
          <div class="about__text" id="about-text"></div>
        </div>
        <ul class="stats" id="stats"></ul>
      </div>
    </section>

    <section class="section" id="skills">
      <div class="container">
        <h2 class="section__title">Что умею</h2>
        <div class="skills" id="skills-list"></div>
      </div>
    </section>

    <section class="section" id="experience">
      <div class="container">
        <h2 class="section__title">Опыт</h2>
        <ol class="timeline" id="timeline"></ol>
      </div>
    </section>

    <section class="section section--contact" id="contact">
      <div class="container contact">
        <h2 class="section__title">Контакты</h2>
        <p class="contact__lead">Расскажите о задаче, и я предложу решение и сроки. Код всех работ открыт на GitHub.</p>
        <div class="contact__links" id="contact-links"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <p>© <span id="year"></span> <span data-bind="name"></span></p>
      <a href="#top">Наверх ↑</a>
    </div>
  </footer>

  <noscript><p class="container">Для отображения содержимого включите JavaScript.</p></noscript>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
